version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: perfdb
      POSTGRES_USER: db_whisperer
      POSTGRES_PASSWORD: securepass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  backend:
    build: .
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
    ports:
      - "4000:4000"
    volumes:
      - ./server.js:/app/server.js

  frontend:
    image: node:18
    working_dir: /app
    command: bash -c "npm install -g serve && cp /shared/index.html . && serve -s . -l 3000"
    volumes:
      - ./index.html:/shared/index.html
    ports:
      - "3000:3000"

volumes:
  pgdata: